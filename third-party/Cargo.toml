[package]
name = "buck2-nextest-adapter-dependencies"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
quick-xml = { version = "=0.37.5", default-features = false }
rustix = { version = "=0.38.44", default-features = false, features = ["fs", "process", "use-libc", "linux_latest"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.128", default-features = false, features = ["std"] }
sha2 = "=0.10.8"
signal-hook = { version = "=0.3.17", features = ["iterator"] }
tempfile = "=3.13.0"
